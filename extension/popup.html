<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dip</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img src="icons/48.png" width="20" height="20" alt="" />Dip</div>
      <nav>
        <button id="check" class="icon" title="Check now" aria-label="Check prices now"></button>
        <button id="settings" class="icon" title="Settings" aria-label="Settings"></button>
      </nav>
    </header>

    <button id="watch" class="primary"></button>
    <div id="toast" role="status" hidden></div>

    <div id="tools" hidden>
      <label class="search"><input id="q" type="search" placeholder="Search" aria-label="Search" /></label>
      <select id="show" aria-label="Show"></select>
      <select id="sort" aria-label="Sort">
        <option value="added">Newest</option>
        <option value="drop">Biggest drop</option>
        <option value="price">Price</option>
        <option value="name">Name</option>
        <option value="shop">Shop</option>
        <option value="checked">Checked</option>
      </select>
    </div>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing watched yet</p>
    <p id="none" class="empty" hidden>No matches</p>

    <div id="modal" class="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
